# Local Postgres for development: `pnpm db:up`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
